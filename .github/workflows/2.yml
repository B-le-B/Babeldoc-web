name: Sync and Auto Deploy

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          if ! git remote | grep -q upstream; then
            git remote add upstream https://github.com/funstory-ai/BabelDOC.git
            echo "✅ Added upstream remote"
          else
            echo "ℹ️ Upstream remote already exists"
            git remote set-url upstream https://github.com/funstory-ai/BabelDOC.git
          fi
          echo "Current remotes:"
          git remote -v

      - name: Fetch upstream
        run: |
          echo "📥 Fetching upstream..."
          git fetch upstream --prune || {
            echo "❌ Failed to fetch upstream"
            exit 1
          }
          echo "✅ Fetch successful"
