name: Sync Upstream Repository

on:
  # 每天检查一次更新
  schedule:
    - cron: '0 8 * * *'  # 每天早上8点
  
  # 支持手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 获取完整历史，确保能正确合并
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/funstory-ai/BabelDOC.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Check for updates
        id: check
        run: |
          # 检查是否有新的提交
          UPSTREAM_COMMITS=$(git rev-list HEAD..upstream/main --count)
          echo "commits=$UPSTREAM_COMMITS" >> $GITHUB_OUTPUT
          
          if [ "$UPSTREAM_COMMITS" -gt 0 ]; then
            echo "Found $UPSTREAM_COMMITS new commits"
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "No new commits"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.has_updates == 'true'
        run: |
          # 合并上游更改
          git merge upstream/main --no-edit
          
          # 如果有冲突，优先保留我们的依赖文件修改
          if [ $? -ne 0 ]; then
            echo "Merge conflicts detected, attempting to resolve..."
            
            # 对于常见的依赖文件，保留我们的版本
            git checkout --ours package.json package-lock.json || true
            git checkout --ours requirements.txt || true
            git checkout --ours pom.xml || true
            git checkout --ours composer.json composer.lock || true
            git checkout --ours go.mod go.sum || true
            git checkout --ours Cargo.toml Cargo.lock || true
            
            # 添加解决的文件
            git add .
            git commit -m "Resolve merge conflicts - keep local dependencies"
          fi

      - name: Push changes
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git push origin main

      - name: Create summary
        if: steps.check.outputs.has_updates == 'true'
        run: |
          echo "## 🔄 Upstream Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "Successfully synced ${{ steps.check.outputs.commits }} new commits from upstream." >> $GITHUB_STEP_SUMMARY
          echo "### Recent Changes:" >> $GITHUB_STEP_SUMMARY
          git log --oneline -10 >> $GITHUB_STEP_SUMMARY
