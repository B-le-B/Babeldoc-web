# .github/workflows/sync-and-deploy.yml
name: Sync and Auto Deploy

permissions:
  contents: write
  workflows: write  # 添加这个权限

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          git remote add upstream https://github.com/funstory-ai/BabelDOC.git || true
          git fetch upstream
          
          UPSTREAM_COMMITS=$(git rev-list HEAD..upstream/main --count 2>/dev/null || echo "0")
          
          if [ "$UPSTREAM_COMMITS" -gt 0 ]; then
            echo "Found updates, syncing..."
            
            if git merge upstream/main --no-edit; then
              echo "✅ Merge successful"
            else
              echo "⚠️ Resolving conflicts..."
              git checkout --ours requirements.txt || true
              git checkout --ours package.json || true
              git add .
              git commit -m "Resolve conflicts"
            fi
            
            git push origin main
            echo "🚀 Code updated, Streamlit Cloud will auto-deploy!"
          else
            echo "📌 No updates available"
          fi
